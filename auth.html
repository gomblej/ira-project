<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Best Cyprus Properties</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .card { background: white; border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; }
  .logo { text-align: center; font-size: 12px; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .logo-main { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .logo-sub { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }

  .tabs { display: flex; background: #f5f5f0; border-radius: 12px; padding: 4px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #888; border: none; background: transparent; transition: all 0.2s; }
  .tab.active { background: white; color: #1a1a1a; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .form-group label { font-size: 13px; color: #666; }
  .form-group input { font-size: 15px; padding: 12px 14px; border-radius: 12px; border: 1px solid #e0e0e0; background: #f8f8f8; color: #1a1a1a; font-family: inherit; width: 100%; transition: border-color 0.2s; }
  .form-group input:focus { outline: none; border-color: #0f6e56; background: white; }
  .form-group input.error { border-color: #c0392b; }
  .field-error { font-size: 12px; color: #c0392b; margin-top: 2px; }

  .submit-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: #0f6e56; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: background 0.2s; }
  .submit-btn:hover { background: #0d5e49; }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .divider { text-align: center; color: #aaa; font-size: 13px; margin: 16px 0; }

  .msg { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 14px; display: none; }
  .msg.success { background: #e6f7f2; color: #0f6e56; }
  .msg.error { background: #fff0f0; color: #c0392b; }

  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { font-size: 14px; color: #0f6e56; text-decoration: none; }

  .benefits { background: #f8f8f8; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .benefits-title { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 10px; }
  .benefit { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; margin-bottom: 6px; }
  .benefit:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Best Cyprus Properties</div>
  <div class="logo-main" id="card-title">Добро пожаловать</div>
  <div class="logo-sub" id="card-sub">Войдите или создайте аккаунт</div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Войти</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</button>
  </div>

  <div class="msg" id="msg"></div>

  <!-- Преимущества регистрации (показываем на вкладке регистрации) -->
  <div class="benefits" id="benefits" style="display:none">
    <div class="benefits-title">Что даёт аккаунт:</div>
    <div class="benefit">❤️ Сохраняйте понравившиеся объекты</div>
    <div class="benefit">📝 Ведите личные заметки по каждому объекту</div>
    <div class="benefit">⚡ Отправляйте заявки в один клик</div>
    <div class="benefit">☁️ Доступ с любого устройства</div>
  </div>

  <!-- Форма входа -->
  <div id="form-login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="Введите пароль" onkeydown="if(event.key==='Enter') submitLogin()">
    </div>
    <button class="submit-btn" id="login-btn" onclick="submitLogin()">Войти</button>
    <div class="divider">или</div>
    <button class="submit-btn" style="background:#f0f0f0;color:#1a1a1a" onclick="switchTab('register')">Создать аккаунт</button>
  </div>

  <!-- Форма регистрации -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label>Имя</label>
      <input type="text" id="reg-name" placeholder="Ваше имя">
      <div class="field-error" id="reg-name-err"></div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="your@email.com">
      <div class="field-error" id="reg-email-err"></div>
    </div>
    <div class="form-group">
      <label>Телефон (необязательно)</label>
      <input type="tel" id="reg-phone" placeholder="+357...">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="reg-password" placeholder="Минимум 6 символов">
      <div class="field-error" id="reg-password-err"></div>
    </div>
    <div class="form-group">
      <label>Повторите пароль</label>
      <input type="password" id="reg-password2" placeholder="Повторите пароль" onkeydown="if(event.key==='Enter') submitRegister()">
      <div class="field-error" id="reg-password2-err"></div>
    </div>
    <button class="submit-btn" id="register-btn" onclick="submitRegister()">Создать аккаунт</button>
  </div>

  <div class="back-link"><a href="index.html">← Вернуться на сайт</a></div>
</div>

<script>
const SUPABASE_URL = 'https://lfgqhprihykoxqfnubhc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-E46ER3EDjD4TTMMiTRaCQ_9xAe36q_';

// Если уже залогинен — редирект на главную
async function checkSession(){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${getToken()}` }
  });
  if(res.ok){ window.location.href='index.html'; }
}

function getToken(){ return localStorage.getItem('bcp_token')||''; }

function switchTab(tab){
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('form-login').style.display = tab==='login'?'block':'none';
  document.getElementById('form-register').style.display = tab==='register'?'block':'none';
  document.getElementById('benefits').style.display = tab==='register'?'block':'none';
  document.getElementById('card-title').textContent = tab==='login'?'Добро пожаловать':'Создать аккаунт';
  document.getElementById('card-sub').textContent = tab==='login'?'Войдите в свой аккаунт':'Заполните данные ниже';
  hideMsg();
}

function showMsg(text, type){
  const el=document.getElementById('msg');
  el.textContent=text; el.className=`msg ${type}`; el.style.display='block';
}
function hideMsg(){ document.getElementById('msg').style.display='none'; }

async function submitLogin(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  if(!email||!password){ showMsg('Заполните все поля', 'error'); return; }

  const btn=document.getElementById('login-btn');
  btn.disabled=true; btn.textContent='Входим...';

  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();

  if(res.ok){
    localStorage.setItem('bcp_token', data.access_token);
    localStorage.setItem('bcp_refresh', data.refresh_token);
    localStorage.setItem('bcp_user', JSON.stringify(data.user));
    // Загружаем профиль
    await loadProfile(data.access_token, data.user.id);
    window.location.href='index.html';
  } else {
    showMsg(data.error_description||data.msg||'Неверный email или пароль', 'error');
    btn.disabled=false; btn.textContent='Войти';
  }
}

async function submitRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const phone=document.getElementById('reg-phone').value.trim();
  const password=document.getElementById('reg-password').value;
  const password2=document.getElementById('reg-password2').value;

  let valid=true;
  if(!name){ document.getElementById('reg-name-err').textContent='Введите имя'; valid=false; } else { document.getElementById('reg-name-err').textContent=''; }
  if(!email){ document.getElementById('reg-email-err').textContent='Введите email'; valid=false; } else { document.getElementById('reg-email-err').textContent=''; }
  if(password.length<6){ document.getElementById('reg-password-err').textContent='Минимум 6 символов'; valid=false; } else { document.getElementById('reg-password-err').textContent=''; }
  if(password!==password2){ document.getElementById('reg-password2-err').textContent='Пароли не совпадают'; valid=false; } else { document.getElementById('reg-password2-err').textContent=''; }
  if(!valid) return;

  const btn=document.getElementById('register-btn');
  btn.disabled=true; btn.textContent='Создаём аккаунт...';

  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password, data:{ name, phone } })
  });
  const data = await res.json();

  if(res.ok){
    if(data.user && data.user.confirmation_sent_at){
      showMsg('✅ Письмо с подтверждением отправлено на '+email+'. Проверьте почту и нажмите на ссылку.', 'success');
      // Сохраняем имя и телефон для создания профиля после подтверждения
      localStorage.setItem('bcp_pending_name', name);
      localStorage.setItem('bcp_pending_phone', phone);
    } else if(data.session){
      localStorage.setItem('bcp_token', data.session.access_token);
      localStorage.setItem('bcp_refresh', data.session.refresh_token);
      localStorage.setItem('bcp_user', JSON.stringify(data.user));
      await createProfile(data.session.access_token, data.user.id, name, phone);
      window.location.href='index.html';
    }
  } else {
    showMsg(data.error_description||data.msg||'Ошибка регистрации', 'error');
  }

  btn.disabled=false; btn.textContent='Создать аккаунт';
}

async function createProfile(token, userId, name, phone){
  await fetch(`${SUPABASE_URL}/rest/v1/user_profiles`, {
    method:'POST',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':`Bearer ${token}`,
      'Content-Type':'application/json',
      'Prefer':'return=minimal'
    },
    body: JSON.stringify({ id:userId, name, phone })
  });
}

async function loadProfile(token, userId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${userId}&select=*`, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${token}` }
  });
  const data = await res.json();
  if(data.length) localStorage.setItem('bcp_profile', JSON.stringify(data[0]));
}

// Обработка редиректа после подтверждения email
async function handleAuthCallback(){
  const hash = window.location.hash;
  if(hash && hash.includes('access_token')){
    const params = new URLSearchParams(hash.substring(1));
    const token = params.get('access_token');
    const refresh = params.get('refresh_token');
    if(token){
      localStorage.setItem('bcp_token', token);
      if(refresh) localStorage.setItem('bcp_refresh', refresh);
      // Получаем пользователя
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${token}` }
      });
      if(res.ok){
        const user = await res.json();
        localStorage.setItem('bcp_user', JSON.stringify(user));
        // Создаём профиль если есть pending данные
        const name = localStorage.getItem('bcp_pending_name');
        const phone = localStorage.getItem('bcp_pending_phone');
        if(name){
          await createProfile(token, user.id, name, phone||'');
          localStorage.removeItem('bcp_pending_name');
          localStorage.removeItem('bcp_pending_phone');
        } else {
          await loadProfile(token, user.id);
        }
        window.location.href='index.html';
      }
    }
  }
}

window.onload = async function(){
  await handleAuthCallback();
  // Проверяем не залогинен ли уже
  const token = getToken();
  if(token){
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${token}` }
    });
    if(res.ok) window.location.href='index.html';
  }
  // Проверяем нужно ли открыть вкладку регистрации
  const params = new URLSearchParams(window.location.search);
  if(params.get('mode')==='register') switchTab('register');
};
</script>
</body>
</html>
