<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Cyprus Properties</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ===== ШАПКА ===== */
    .site-header {
      background: white;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .site-header-top {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .site-logo {
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .site-logo-sub {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .site-logo-main {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
    }

    .site-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .lang-switch {
      display: flex;
      gap: 6px;
    }

    .lb {
      padding: 5px 8px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .lb.active {
      border: 2px solid #1a1a1a;
    }

    .lb img {
      display: block;
      border-radius: 2px;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: white;
      font-size: 13px;
      color: #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    .auth-btn.logged {
      background: #e6f7f2;
      border-color: #0f6e56;
      color: #0f6e56;
      font-weight: 600;
    }

    .auth-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #0f6e56;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .auth-avatar img {
      width: 24px;
      height: 24px;
      object-fit: cover;
    }

    /* ===== /ШАПКА ===== */

    .gallery {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .gallery-main {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, #e6f7f2, #b2e0d0);
    }

    .gallery-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
    }

    .gallery-main .no-photo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .gallery-prev,
    .gallery-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-prev {
      left: 10px;
    }

    .gallery-next {
      right: 10px;
    }

    .gallery-counter {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .gallery-thumbs {
      display: flex;
      gap: 6px;
      padding: 10px;
      overflow-x: auto;
    }

    .gallery-thumb {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      opacity: 0.6;
      flex-shrink: 0;
      border: 2px solid transparent;

    .gallery-thumb.active {

    .prop-header-left {

    .prop-title {

    .prop-price {

<body>

  <div class="wrap" id="page">

    <!-- ШАПКА -->
    <div class="site-header">
      <div class="site-header-top">
        <a class="site-logo" href="index.html">
          <span class="site-logo-sub">Best Cyprus Properties</span>
          <span class="site-logo-main" id="logo-tagline"></span>
        </a>
        <div class="site-header-right">
          <div class="lang-switch">
            <button class="lb active" onclick="setLang('ru',this)"><img src="https://flagcdn.com/24x18/ru.png"
                alt="RU"></button>
            <button class="lb" onclick="setLang('en',this)"><img src="https://flagcdn.com/24x18/gb.png"
                alt="EN"></button>
            <button class="lb" onclick="setLang('el',this)"><img src="https://flagcdn.com/24x18/cy.png"
                alt="ΕΛ"></button>
            <button class="lb" onclick="setLang('he',this)"><img src="https://flagcdn.com/24x18/il.png"
                alt="HE"></button>
          </div>
          <a id="auth-btn" class="auth-btn" href="auth.html">👤</a>
        </div>
      </div>
    </div>

    <div class="loading" id="content">⏳</div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close">×</button>
    <button class="lightbox-prev" onclick="event.stopPropagation();lbNav(-1)">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-next" onclick="event.stopPropagation();lbNav(1)">›</button>
  </div>

  <div class="auth-popup" id="auth-popup">
    <div class="auth-popup-card">
      <div class="auth-popup-icon">📝</div>
      <div class="auth-popup-title" id="popup-title"></div>
      <div class="auth-popup-sub" id="popup-sub"></div>
      <div class="auth-popup-btns">
        <button class="auth-popup-reg" id="popup-reg-btn"
          onclick="window.location.href='auth.html?mode=register'"></button>
        <button class="auth-popup-login" id="popup-login-btn" onclick="window.location.href='auth.html'"></button>
      </div>
      <button class="auth-popup-close" id="popup-close-btn" onclick="closeAuthPopup()"></button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lfgqhprihykoxqfnubhc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-E46ER3EDjD4TTMMiTRaCQ_9xAe36q_';
    const TABLE = 'Properties';

    let lang = 'ru', prop = null, galleryIdx = 0, lbImages = [], lbIdx = 0;
    let editingNote = false;
    let favs = new Set(), notes = {};

    function getToken() { return localStorage.getItem('bcp_token') || ''; }
    function isLoggedIn() { return !!getToken(); }
    function getProfile() { try { return JSON.parse(localStorage.getItem('bcp_profile') || 'null'); } catch (e) { return null; } }
    function getUser() { try { return JSON.parse(localStorage.getItem('bcp_user') || 'null'); } catch (e) { return null; } }

    function loadStorage() {
      try {
        const f = localStorage.getItem('bcp_favs'); const n = localStorage.getItem('bcp_notes');
        if (f) f.split(',').filter(Boolean).forEach(id => favs.add(parseInt(id)));
        if (n) Object.assign(notes, JSON.parse(n));
      } catch (e) { }
    }
    function saveNotesLocal() { try { localStorage.setItem('bcp_notes', JSON.stringify(notes)); } catch (e) { } }

    async function loadFavsFromSupabase() {
      const user = getUser(); if (!user) return;
      const token = getToken();
      const [favRes, notesRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/user_favourites?user_id=eq.${user.id}&select=property_id`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }),
        fetch(`${SUPABASE_URL}/rest/v1/user_notes?user_id=eq.${user.id}&select=property_id,note`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } })
      ]);
      const favsData = await favRes.json(); const notesData = await notesRes.json();
      if (!Array.isArray(favsData) || !Array.isArray(notesData)) { localStorage.removeItem('bcp_token'); return; }
      favs = new Set(favsData.map(f => f.property_id));
      notes = {}; notesData.forEach(n => { notes[n.property_id] = n.note; });
    }

    function showAuthPopup() {
      const t = T[lang];
      document.getElementById('popup-title').textContent = t.popupNoteTitle;
      document.getElementById('popup-sub').textContent = t.popupNoteSub;
      document.getElementById('popup-reg-btn').textContent = t.popupRegBtn;

    async function toggleFav() {
      const id = prop.id;
      if (!isLoggedIn()) { window.location.href = 'auth.html?mode=register'; return; }
      const user = getUser(); const token = getToken();
      if (favs.has(id)) {
        if (notes[id]) {
          if (!confirm(T[lang].deleteNoteConfirm)) { updateFavBtn(); return; }
          await fetch(`${SUPABASE_URL}/rest/v1/user_notes?user_id=eq.${user.id}&property_id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } });
          delete notes[id]; renderNote();
        }
        await fetch(`${SUPABASE_URL}/rest/v1/user_favourites?user_id=eq.${user.id}&property_id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } });
        favs.delete(id);
      } else {
        await fetch(`${SUPABASE_URL}/rest/v1/user_favourites`, { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify({ user_id: user.id, property_id: id }) });
        favs.add(id);
      }
      updateFavBtn();
    }

      const isFav = favs.has(prop.id);
      btn.className = 'fav-page-btn' + (isFav ? ' active' : '');
      btn.innerHTML = isFav ? `❤️ ${t.favRemove}` : `🤍 ${t.favAdd}`;

    function updateAuthBtn() {
      const btn = document.getElementById('auth-btn'); if (!btn) return;
      if (isLoggedIn()) {
        const profile = getProfile();
        const name = profile?.name || getUser()?.email?.split('@')[0] || '';
        const avatarUrl = profile?.avatar_url;
        const avatarHtml = avatarUrl
          ? `<div class="auth-avatar"><img src="${avatarUrl}" alt="avatar"></div>`
          : `<div class="auth-avatar">${name ? name[0].toUpperCase() : '👤'}</div>`;
        btn.href = 'profile.html'; btn.className = 'auth-btn logged';
        btn.innerHTML = `${avatarHtml} <span>${name}</span>`;

    }

      const isOpen = form.classList.contains('open');
      if (isOpen) { form.classList.remove('open'); btn.classList.remove('open'); btn.innerHTML = `📝 ${t.enquiryBtn}`; }
      else { form.classList.add('open'); btn.classList.add('open'); btn.innerHTML = `✕ ${t.enquiryBtnClose}`; }
    }
    function onTgCheck() { document.getElementById('tg-field').classList.toggle('show', document.getElementById('ch-tg').checked); }
    function onOtherCheck() { document.getElementById('other-field').classList.toggle('show', document.getElementById('ch-other').checked); }
    function validateForm() {
      const t = T[lang]; let valid = true;
      ['f-name', 'f-phone', 'f-email'].forEach(id => {
        const el = document.getElementById(id); const err = document.getElementById(id + '-err');
        if (!el.value.trim()) { el.classList.add('error'); if (err) { err.textContent = t.fRequired; err.classList.add('show'); } valid = false; }
        else { el.classList.remove('error'); if (err) err.classList.remove('show'); }
      });
      const anyMethod = ['ch-call', 'ch-wa', 'ch-viber', 'ch-tg', 'ch-email'].some(id => document.getElementById(id).checked);
      const methodErr = document.getElementById('method-err');
      if (!anyMethod) { methodErr.classList.add('show'); valid = false; } else methodErr.classList.remove('show');
      if (document.getElementById('ch-tg').checked) {
        const el = document.getElementById('f-tg-nick'); const err = document.getElementById('tg-nick-err');
        if (!el.value.trim()) { el.classList.add('error'); if (err) { err.textContent = t.fTgRequired; err.classList.add('show'); } valid = false; }
        else { el.classList.remove('error'); if (err) err.classList.remove('show'); }
      }
      return valid;
    }
    function submitForm() {
      if (!validateForm()) return;
      document.getElementById('enquiry-form-inner').style.display = 'none';
      document.getElementById('form-success').classList.add('show');
    }

    function renderProp() {
      const t = T[lang]; const d = prop;
      const imgs = d.images && d.images.length > 0 ? d.images : [];
      const rl = roomsLabel(d); const desc = d['description_' + lang] || '';
      const isSold = d.status === 'sold', isUnavail = d.status === 'unavailable', isFav = favs.has(d.id);

      let statusBadge = '';
      if (isSold) statusBadge = `<span class="badge badge-sold">${t.soldBadge}</span>`;
      else if (isUnavail) statusBadge = `<span class="badge badge-unavailable">${t.unavailBadge}</span>`;
      else if (d.market === 'new') statusBadge = `<span class="badge badge-new-build">${t.newBuild}</span>`;
      else statusBadge = `<span class="badge badge-resale">${t.resale}</span>`;

      const galleryHtml = imgs.length > 0 ? `
    <div class="gallery-main">
      <img id="main-img" src="${imgs[0]}" alt="фото" onclick="openLightbox(${galleryIdx})">
      ${imgs.length > 1 ? `<button class="gallery-prev" onclick="galleryNav(-1)">‹</button><button class="gallery-next" onclick="galleryNav(1)">›</button><span class="gallery-counter" id="gallery-counter">1/${imgs.length}</span>` : ''}
    </div>
    ${imgs.length > 1 ? `<div class="gallery-thumbs">${imgs.map((url, i) => `<img class="gallery-thumb ${i === 0 ? 'active' : ''}" src="${url}" onclick="setGallery(${i})" alt="">`).join('')}</div>` : ''}
  `: `<div class="gallery-main"><div class="no-photo">${d.emoji}</div></div>`;

      const params = [];
      params.push(`<div class="param"><div class="param-icon">📍</div><div class="param-value">${getCityLabel(d)}</div><div class="param-label">${t.city}</div></div>`);
      if (rl) params.push(`<div class="param"><div class="param-icon">🛏️</div><div class="param-value">${rl}</div><div class="param-label">${t.rooms}</div></div>`);
      params.push(`<div class="param"><div class="param-icon">📐</div><div class="param-value">${d.area}</div><div class="param-label">${t.area}</div></div>`);
      params.push(`<div class="param"><div class="param-icon">🏠</div><div class="param-value">${t.types[d.type] || d.type}</div><div class="param-label">${t.type}</div></div>`);
      if (d.year_built) params.push(`<div class="param"><div class="param-icon">🏗️</div><div class="param-value">${d.year_built}</div><div class="param-label">${t.year}</div></div>`);
      if (d.pool && d.pool !== 'none') params.push(`<div class="param"><div class="param-icon">🏊</div><div class="param-value">${d.pool === 'yes' ? t.poolYes : t.poolPossible}</div><div class="param-label">${t.pool}</div></div>`);
      if (d.sea_walking) params.push(`<div class="param"><div class="param-icon">🌊</div><div class="param-value">✓</div><div class="param-label">${t.sea}</div></div>`);

      const profile = getProfile(); const user = getUser();
      const prefillName = profile?.name || ''; const prefillEmail = user?.email || ''; const prefillPhone = profile?.phone || '';
      const hasAutofill = isLoggedIn() && (prefillName || prefillEmail || prefillPhone);
      let prefillCountryCode = '';
      if (prefillPhone) {
        const allCodes = [...TOP_COUNTRIES, ...ALL_COUNTRIES].sort((a, b) => b.code.length - a.code.length);
        const match = allCodes.find(c => prefillPhone.startsWith(c.code));
        if (match) prefillCountryCode = match.code;
      }
      const prefillPhoneNum = prefillPhone && prefillCountryCode ? prefillPhone.replace(prefillCountryCode, '').trim() : prefillPhone;

      document.getElementById('content').innerHTML = `
    <div class="gallery">${galleryHtml}</div>
    <div class="info-card">
      <div class="prop-header">
        <div class="prop-header-left">
          <h1 class="prop-title">${d['title_' + lang]}${d.is_new && !isSold ? `<span style="display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#fff3e0;color:#e65100;font-weight:600;margin-left:8px">${t.newBadge}</span>` : ''}</h1>
          <div class="prop-price ${isSold ? 'sold' : ''}">€${(d.price * 1000).toLocaleString()}</div>
        </div>
        <button class="fav-page-btn ${isFav ? 'active' : ''}" id="fav-page-btn" onclick="toggleFav()">
          ${isFav ? `❤️ ${t.favRemove}` : `🤍 ${t.favAdd}`}
        </button>
      </div>
      <div class="badges">
        ${statusBadge}
        ${d.is_new && !isSold ? `<span class="badge badge-new">${t.newBadge}</span>` : ''}
        <span class="badge badge-tag">${d['tag_' + lang]}</span>
      </div>
      <div class="params">${params.join('')}</div>
      ${desc ? `<p class="description">${desc}</p>` : `<p class="description" style="color:#aaa">${t.noDesc}</p>`}
    </div>
    <div id="note-section"></div>
    <div class="contact-card">
      <h2>${t.contact}</h2>
      <div class="quick-btns">
        <button class="btn bwa" onclick="location.href='https://wa.me/35799000000?text=${encodeURIComponent(d['title_' + lang])}'">💬 ${t.wa}</button>
        <button class="btn bem" onclick="location.href='mailto:info@bestcyprusproperties.com?subject=${encodeURIComponent(d['title_' + lang])}'">✉️ ${t.em}</button>
      </div>
      <button class="form-toggle-btn" id="enquiry-btn" onclick="toggleForm()">📝 ${t.enquiryBtn}</button>
      <div class="enquiry-form" id="enquiry-form">
        <div id="enquiry-form-inner">
          ${hasAutofill ? `<div class="autofill-banner">✅ ${t.autofillBanner}</div>` : ''}
          <div class="form-section">
            <div class="field"><label>${t.fName}<span class="req">*</span></label><input type="text" id="f-name" value="${prefillName}" class="${prefillName ? 'autofilled' : ''}"><div class="field-error" id="f-name-err"></div></div>
            <div class="field"><label>${t.fPhone}<span class="req">*</span></label>
              <div class="phone-row">${buildCountrySelect(prefillCountryCode)}<input type="tel" id="f-phone" value="${prefillPhoneNum}" class="${prefillPhone ? 'autofilled' : ''}"></div>
              <div class="field-error" id="f-phone-err"></div>
            </div>
            <div class="field"><label>${t.fEmail}<span class="req">*</span></label><input type="email" id="f-email" value="${prefillEmail}" class="${prefillEmail ? 'autofilled' : ''}"><div class="field-error" id="f-email-err"></div></div>
          </div>
          <div class="form-section">
            <div class="form-section-title">${t.fContactMethod}</div>
            <div class="checks">
              <label class="check-item"><input type="checkbox" id="ch-call"><span>📞 ${t.fCall}</span></label>
              <label class="check-item"><input type="checkbox" id="ch-wa"><span>💬 ${t.fWa}</span></label>
              <label class="check-item"><input type="checkbox" id="ch-viber"><span>📱 ${t.fViber}</span></label>
              <label class="check-item"><input type="checkbox" id="ch-tg" onchange="onTgCheck()"><span>✈️ ${t.fTg}</span></label>
              <div class="telegram-field" id="tg-field"><div class="field"><label>${t.fTgNick}<span class="req">*</span></label><input type="text" id="f-tg-nick" placeholder="@username"><div class="field-error" id="tg-nick-err"></div></div></div>
              <label class="check-item"><input type="checkbox" id="ch-email"><span>✉️ ${t.fEmailOpt}</span></label>
            </div>
            <div class="field-error" id="method-err" style="margin-top:8px">${t.fSelectContact}</div>
          </div>
          <div class="form-section">
            <div class="form-section-title">${t.fPurpose}</div>
            <div class="checks">
              <label class="check-item"><input type="checkbox" id="ch-question"><span>❓ ${t.fQuestion}</span></label>
              <label class="check-item"><input type="checkbox" id="ch-viewing"><span>🏠 ${t.fViewing}</span></label>
              <label class="check-item"><input type="checkbox" id="ch-other" onchange="onOtherCheck()"><span>✏️ ${t.fOther}</span></label>
            </div>
            <div class="other-field" id="other-field"><div class="field" style="margin-top:8px"><textarea id="f-other" rows="3" placeholder="${t.fOtherText}"></textarea></div></div>
          </div>
          <button class="submit-btn" onclick="submitForm()">${t.fSubmit}</button>
        </div>
        <div class="form-success" id="form-success">
          <div style="font-size:40px;margin-bottom:10px">✅</div>
          <div style="font-size:17px;font-weight:700;margin-bottom:6px;color:#0f6e56">${t.fSuccessTitle}</div>
          <div style="color:#666">${t.fSuccessText}</div>
        </div>
      </div>
    </div>`;

      document.title = d['title_' + lang] + ' — Best Cyprus Properties';
      renderNote();
    }

    window.onload = async function () {
      // Язык из localStorage
      const savedLang = localStorage.getItem('bcp_lang');
      if (savedLang && T[savedLang]) {
        lang = savedLang;
        document.querySelectorAll('.lb').forEach(b => b.classList.remove('active'));
        const activeLb = document.querySelector(`.lb[onclick*="'${savedLang}'"]`);
        if (activeLb) activeLb.classList.add('active');
      }
      document.getElementById('page').setAttribute('dir', T[lang].rtl ? 'rtl' : 'ltr');
      document.getElementById('logo-tagline').textContent = T[lang].logoTagline;
      updateAuthBtn();

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { document.getElementById('content').innerHTML = '<div class="error-msg">Объект не найден</div>'; return; }
      try {
        if (isLoggedIn()) { await loadFavsFromSupabase(); } else { loadStorage(); }
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}&select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
        const data = await res.json();
        if (!data.length) { document.getElementById('content').innerHTML = '<div class="error-msg">Объект не найден</div>'; return; }
        prop = data[0];
        renderProp();
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="error-msg">Ошибка загрузки</div>';
      }
    };
  </script>
</body>

</html>
