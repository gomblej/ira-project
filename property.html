    function setLang(l, btn) {
      lang = l;
      document.querySelectorAll('.lb').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.getElementById('page').setAttribute('dir', T[l].rtl ? 'rtl' : 'ltr');

    function getCityLabel(d) { return T[lang].cities[d.district ? d.city + '_district' : d.city] || d.city; }
    function roomsLabel(d) {
      const t = T[lang];
      if (['apt', 'penthouse', 'house', 'townhouse'].includes(d.type) && d.rooms === 0) return t.studio;
      if (d.rooms === 0) return '';
      if (d.rooms >= 5) return `5+ ${t.rooms}`;
      return `${d.rooms} ${t.rooms}`;
    }

    function openLightbox(idx) { lbImages = prop.images || []; lbIdx = idx; document.getElementById('lightbox-img').src = lbImages[idx]; document.getElementById('lightbox').classList.add('open'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
    function lbNav(dir) { lbIdx = (lbIdx + dir + lbImages.length) % lbImages.length; document.getElementById('lightbox-img').src = lbImages[lbIdx]; }

    function setGallery(idx) {
      galleryIdx = idx;
      const imgs = prop.images || [];
      if (!imgs.length) return;
      document.getElementById('main-img').src = imgs[idx];
      document.querySelectorAll('.gallery-thumb').forEach((t, i) => t.classList.toggle('active', i === idx));
      const ctr = document.getElementById('gallery-counter');
      if (ctr) ctr.textContent = `${idx + 1}/${imgs.length}`;
    }
    function galleryNav(dir) { const imgs = prop.images || []; if (!imgs.length) return; setGallery((galleryIdx + dir + imgs.length) % imgs.length); }

    function toggleForm() {
      const btn = document.getElementById('enquiry-btn');
      const form = document.getElementById('enquiry-form');
      const t = T[lang];
      const isOpen = form.classList.contains('open');
      if (isOpen) {
        form.classList.remove('open');
        btn.classList.remove('open');
        btn.innerHTML = `📝 ${t.enquiryBtn}`;
      } else {
        form.classList.add('open');
        btn.classList.add('open');
        btn.innerHTML = `✕ ${t.enquiryBtnClose}`;

    function onTgCheck() {
      document.getElementById('tg-field').classList.toggle('show', document.getElementById('ch-tg').checked);

    function onOtherCheck() {
      document.getElementById('other-field').classList.toggle('show', document.getElementById('ch-other').checked);

    function validateForm() {
      const t = T[lang];
      let valid = true;
      ['f-name', 'f-phone', 'f-email'].forEach(id => {
        const el = document.getElementById(id);
        const err = document.getElementById(id + '-err');
        if (!el.value.trim()) { el.classList.add('error'); if (err) { err.textContent = t.fRequired; err.classList.add('show'); } valid = false; }
        else { el.classList.remove('error'); if (err) err.classList.remove('show'); }
      });
      const anyMethod = ['ch-call', 'ch-wa', 'ch-viber', 'ch-tg', 'ch-email'].some(id => document.getElementById(id).checked);
      const methodErr = document.getElementById('method-err');
      if (!anyMethod) { methodErr.classList.add('show'); valid = false; }
      else methodErr.classList.remove('show');
      if (document.getElementById('ch-tg').checked) {
        const el = document.getElementById('f-tg-nick');
        const err = document.getElementById('tg-nick-err');
        if (!el.value.trim()) { el.classList.add('error'); if (err) { err.textContent = t.fTgRequired; err.classList.add('show'); } valid = false; }
        else { el.classList.remove('error'); if (err) err.classList.remove('show'); }
      }
      return valid;
    }

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}&select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
        const data = await res.json();
        if (!data.length) { document.getElementById('content').innerHTML = '<div class="error-msg">Объект не найден</div>'; return; }
        prop = data[0];
        setLang('ru', document.querySelector('.lb'));
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="error-msg">Ошибка загрузки</div>';
      }
    };
  </script>
