<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f6e56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Settled">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Cyprus Properties</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .lang-switch {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .lb {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .lb.active {
      border: 2px solid #1a1a1a;
    }

    .lb img {
      display: block;
      border-radius: 2px;
    }

    .header {
      background: white;
      border-radius: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .header-top {
      padding: 16px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-center {
      flex: 1;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e0;
      background: white;
      font-size: 13px;
      color: #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    .auth-btn:hover {
      background: #f8f8f8;
    }

    .auth-btn.logged {
      background: #e6f7f2;
      border-color: #0f6e56;
      color: #0f6e56;
      font-weight: 600;
    }

    .auth-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #0f6e56;
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .auth-avatar img {
      width: 26px;
      height: 26px;
      object-fit: cover;
    }

    .tabs {
      display: flex;
      border-top: 1px solid #f0f0f0;
    }

    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      border: none;
      background: transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab.active {
      color: #0f6e56;
      border-bottom: 3px solid #0f6e56;
    }

    .tab:first-child {
      border-right: 1px solid #f0f0f0;
    }

    .tab.sell-tab.active {
      color: #e8a020;
      border-bottom-color: #e8a020;
    }

    .buy-panel {
      display: block;
    }

    .sell-panel {
      display: none;
    }

    .sell-panel.active {
      display: block;
    }

    .buy-panel.hidden {
      display: none;
    }

    .sell-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 14px;
    }

    .sell-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sell-card p {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    .sell-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media(max-width:600px) {
      .sell-grid {
        grid-template-columns: 1fr;
      }
    }

    .sell-grid .full {
      grid-column: 1/-1;
    }

    .field-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .sell-card input,
    .sell-card select,
    .sell-card textarea {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      color: #1a1a1a;
      width: 100%;
      font-family: inherit;
      resize: none;
    }

    .sell-card input.autofilled {
      background: #f0faf7;
      border-color: #b2ddd1;
    }

    .sell-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #e8a020;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .sell-success {
      text-align: center;
      padding: 30px;
      display: none;
    }

    .sell-success.show {
      display: block;
    }

    .autofill-banner {
      background: #e6f7f2;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #0f6e56;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filters {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 160px;
    }

    .fg label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fg select {
      font-size: 14px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      color: #1a1a1a;
      width: 100%;
    }

    .more-filters-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      color: #1a1a1a;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .more-filters-btn.active {
      background: #0f6e56;
      color: white;
      border-color: #0f6e56;
    }

    .count-badge {
      background: #e8a020;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .more-filters-btn.has-active .count-badge {
      display: flex;
    }

    .extra-filters {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 10px;
    }

    .extra-filters.open {
      display: block;
    }

    .extra-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .extra-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .extra-section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .beds-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bed-pill {
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      color: #666;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .bed-pill:hover {
      border-color: #0f6e56;
      color: #0f6e56;
    }

    .bed-pill.active {
      background: #0f6e56;
      color: white;
      border-color: #0f6e56;
    }

    .range-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .range-input-wrap {
      flex: 1;
      position: relative;
    }

    .range-input-wrap input {
      width: 100%;
      font-size: 14px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      color: #1a1a1a;
    }

    .range-input-wrap.with-prefix input {
      padding-left: 26px;
    }

    .range-input-wrap.with-prefix::before {
      content: attr(data-prefix);
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
    }

    .range-sep {
      color: #aaa;
      font-size: 16px;
      flex-shrink: 0;
    }

    .check-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .check-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #f8f8f8;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      user-select: none;
      transition: all 0.15s;
    }

    .check-pill input {
      display: none;
    }

    .check-pill.active {
      background: #0f6e56;
      color: white;
      border-color: #0f6e56;
    }

    .check-pill:hover:not(.active) {
      border-color: #0f6e56;
      color: #0f6e56;
    }

    .sticky-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #f5f5f0;
      padding: 8px 0;
      margin-bottom: 4px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: white;
      color: #666;
      cursor: pointer;
    }

    .sort-btn.active {
      background: #0f6e56;
      color: white;
      border-color: #0f6e56;
    }

    .top-bar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .reset-btn {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #c0392b;
      background: white;
      color: #c0392b;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }

    .reset-btn:hover {
      background: #fff0f0;
    }

    .fav-toggle {
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: white;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .fav-toggle.active {
      background: #fce4ec;
      color: #ad1457;
      border-color: #ad1457;
      font-weight: 500;
    }

    .recs-block {
      margin-bottom: 20px;
    }

    .recs-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recs-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .recs-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .recs-scroll::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 4px;
    }

    .rec-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      width: 240px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .rec-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .rec-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .rec-img-placeholder {
      width: 100%;
      height: 140px;
      background: linear-gradient(135deg, #e6f7f2, #b2e0d0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .rec-body {
      padding: 12px;
    }

    .rec-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rec-price {
      font-size: 14px;
      font-weight: 700;
      color: #0f6e56;
    }

    .rec-meta {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }

    .count {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 15px;
      grid-column: 1/-1;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .card.sold .card-img-wrap {
      filter: grayscale(60%);
    }

    .card.unavailable .card-img-wrap {
      filter: grayscale(30%);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #e6f7f2, #b2e0d0);
      overflow: hidden;
    }

    .card-img-wrap .no-photo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .gallery-nav-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
    }

    .gallery-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .gallery-dot.active {
      background: white;
    }

    .gallery-prev,
    .gallery-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.35);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .gallery-prev {
      left: 8px;
    }

    .gallery-next {
      right: 8px;
    }

    .photo-count {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .status-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      z-index: 4;
    }

    .badge-new-build {
      background: #e3f2fd;
      color: #1565c0;
    }

    .badge-resale {
      background: #f3e5f5;
      color: #6a1b9a;
    }

    .badge-sold {
      background: #1a1a1a;
      color: white;
    }

    .badge-unavailable {
      background: #fff3cd;
      color: #856404;
    }

    .sold-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .sold-stamp {
      font-size: 28px;
      font-weight: 900;
      color: rgba(0, 0, 0, 0.18);
      border: 4px solid rgba(0, 0, 0, 0.15);
      padding: 6px 16px;
      border-radius: 8px;
      transform: rotate(-15deg);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 16px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-price {
      font-size: 16px;
      font-weight: 700;
      color: #0f6e56;
      white-space: nowrap;
    }

    .card.sold .card-price {
      color: #888;
      text-decoration: line-through;
    }

    .card-meta {
      display: flex;
      gap: 12px;
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #e6f7f2;
      color: #0f6e56;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .new-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #fff3e0;
      color: #e65100;
      font-weight: 600;
      margin-left: 6px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .view-btn {
      font-size: 13px;
      color: #0f6e56;
      font-weight: 500;
    }

    .quick-wa {
      background: #25D366;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }

    .note-area {
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .note-display {
      font-size: 13px;
      color: #555;
      background: #fffde7;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border: 1px solid #fff176;
      white-space: pre-wrap;
    }

    .note-display.empty {
      color: #aaa;
      background: #f8f8f8;
      border: 1px dashed #ddd;
      white-space: normal;
    }

    .note-edit-wrap {
      background: #fffde7;
      border-radius: 10px;
      border: 1px solid #0f6e56;
      overflow: hidden;
    }

    .note-input {
      width: 100%;
      font-size: 13px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #1a1a1a;
      font-family: inherit;
      resize: none;
      outline: none;
      display: block;
    }

    .note-save-btn {
      width: 100%;
      padding: 7px;
      border: none;
      background: #0f6e56;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 500;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
    }

    .auth-popup.open {
      display: flex;
    }

    .auth-popup-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .auth-popup-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .auth-popup-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .auth-popup-benefits {
      text-align: left;
      background: #f8f8f8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .auth-popup-benefit {
      display: flex;

      if (!isLoggedIn()) return;

        const res = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${user.id}&select=*`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${getToken()}` } });

      try {

      const user = getUser(); if (!user) return;
      const token = getToken();
      const [favRes, notesRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/user_favourites?user_id=eq.${user.id}&select=property_id`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } }),
        fetch(`${SUPABASE_URL}/rest/v1/user_notes?user_id=eq.${user.id}&select=property_id,note`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` } })

      const favsData = await favRes.json(); const notesData = await notesRes.json();
      if (!Array.isArray(favsData) || !Array.isArray(notesData)) { localStorage.removeItem('bcp_token'); location.reload(); return; }

    async function submitSellForm() {
      const name = document.getElementById('sf-name').value.trim();
      const phone = document.getElementById('sf-phone').value.trim();
      const type = document.getElementById('sf-type').value;
      const market = document.getElementById('sf-market').value;
      const area = document.getElementById('sf-area').value.trim();
      const price = document.getElementById('sf-price').value.trim();
      const desc = document.getElementById('sf-desc').value.trim();
      const t = T[lang];

      let msg = `🏡 <b>Хочу продать недвижимость</b>\n\n`;
      msg += `<b>Имя:</b> ${name || '—'}\n`;
      msg += `<b>Телефон:</b> ${phone || '—'}\n`;
      msg += `<b>Тип:</b> ${t[type] || type}\n`;
      msg += `<b>Рынок:</b> ${market === 'new' ? t.newBuild : t.resale}\n`;
      if (area) msg += `<b>Площадь:</b> ${area} м²\n`;
      if (price) msg += `<b>Цена:</b> €${price}\n`;
      if (desc) msg += `<b>Описание:</b> ${desc}\n`;
      msg += `\n🌐 Язык клиента: ${lang.toUpperCase()}`;

      await sendToTelegram(msg);

      document.getElementById('sell-success-title').textContent = t.sfSuccessTitle;
      document.getElementById('sell-success-text').textContent = t.sfSuccessText;

    function buildRecs() {
      const t = T[lang]; const block = document.getElementById('recs-block'); const scroll = document.getElementById('recs-scroll');

        recs = ALL_DATA.filter(d => !favs.has(d.id) && d.status === 'available' && (favCities.has(d.city) || favTypes.has(d.type))).slice(0, 8);
        document.getElementById('recs-title-text').textContent = t.recsTitle;

      }
      if (!recs.length) { block.style.display = 'none'; return; }
      scroll.innerHTML = recs.map(d => { const img = d.images?.length > 0 ? `<img class="rec-img" src="${d.images[0]}" alt="фото">` : `<div class="rec-img-placeholder">${d.emoji}</div>`; const rl = roomsLabel(d); return `<div class="rec-card" onclick="goToProperty(${d.id})">${img}<div class="rec-body"><div class="rec-title">${d['title_' + lang]}</div><div class="rec-price">€${(d.price * 1000).toLocaleString()}</div><div class="rec-meta">📍 ${getCityLabel(d)}${rl ? ' · 🛏️ ' + rl : ''}</div></div></div>`; }).join('');
      block.style.display = 'block';
    }

    function updateTexts() {
      const t = T[lang];
      document.getElementById('app').setAttribute('dir', t.rtl ? 'rtl' : 'ltr');
      document.getElementById('hn').textContent = t.h; document.getElementById('hs').textContent = t.s;
      document.getElementById('tab-buy-label').textContent = t.tabBuy; document.getElementById('tab-sell-label').textContent = t.tabSell;
      document.getElementById('lc').textContent = t.lc; document.getElementById('lt').textContent = t.lt; document.getElementById('lm').textContent = t.lm; document.getElementById('lst-label').textContent = t.lstL;
      document.getElementById('lb2').textContent = t.lb2; document.getElementById('lp').textContent = t.lp; document.getElementById('l-internal').textContent = t.lInternal; document.getElementById('l-plot').textContent = t.lPlot; document.getElementById('l-year').textContent = t.lYear; document.getElementById('l-pool').textContent = t.lPool; document.getElementById('l-sea').textContent = t.lSea;
      document.getElementById('pmin').placeholder = t.priceFrom; document.getElementById('pmax').placeholder = t.priceTo; document.getElementById('reset-label').textContent = t.resetLabel;
      const cityKeys = ['Limassol', 'Limassol_district', 'Paphos', 'Paphos_district', 'Larnaca', 'Larnaca_district', 'Nicosia', 'Nicosia_district', 'Famagusta_district'];
      const fc = document.getElementById('fc'); fc.options[0].text = t.all; cityKeys.forEach((c, i) => { if (fc.options[i + 1]) fc.options[i + 1].text = t.cities[c]; });
      const ft = document.getElementById('ft'); ft.options[0].text = t.all;['apt', 'penthouse', 'house', 'townhouse', 'land_res', 'land_other', 'commercial', 'building'].forEach((v, i) => { if (ft.options[i + 1]) ft.options[i + 1].text = t[v]; });
      const fmk = document.getElementById('fm'); fmk.options[0].text = t.all; if (fmk.options[1]) fmk.options[1].text = t.newBuild; if (fmk.options[2]) fmk.options[2].text = t.resale;
      const fs = document.getElementById('fs');[t.statusAll, t.statusAvailable, t.statusSold, t.statusUnavailable].forEach((v, i) => { if (fs.options[i]) fs.options[i].text = v; });
      document.getElementById('sell-title').textContent = t.sellTitle; document.getElementById('sell-sub').textContent = t.sellSub;
      ['name', 'phone', 'type', 'market', 'area', 'price', 'desc'].forEach(f => { const el = document.getElementById(`sf-label-${f}`); if (el) el.textContent = t[`sfLabel${f.charAt(0).toUpperCase() + f.slice(1)}`]; });
      document.getElementById('sf-submit').textContent = t.sfSubmit;
      document.getElementById('sf-name').placeholder = t.sfLabelName; document.getElementById('sf-phone').placeholder = t.sfLabelPhone; document.getElementById('sf-area').placeholder = t.sfLabelArea; document.getElementById('sf-price').placeholder = t.sfLabelPrice; document.getElementById('sf-desc').placeholder = t.sfLabelDesc;
      const sfType = document.getElementById('sf-type');['apt', 'house', 'townhouse', 'land_res', 'land_other', 'commercial', 'building'].forEach((v, i) => { if (sfType.options[i]) sfType.options[i].text = t[v]; });
      const sfMarket = document.getElementById('sf-market'); if (sfMarket.options[0]) sfMarket.options[0].text = t.newBuild; if (sfMarket.options[1]) sfMarket.options[1].text = t.resale;
      document.getElementById('ba-search').textContent = t.baSearch; document.getElementById('ba-search-sub').textContent = t.baSearchSub;
      document.getElementById('qf-name').placeholder = t.qfName; document.getElementById('qf-phone').placeholder = t.qfPhone; document.getElementById('qf-budget').placeholder = t.qfBudget; document.getElementById('qf-msg').placeholder = t.qfMsg; document.getElementById('qf-submit').textContent = t.qfSubmit;
      updateFavBtn(); updateMoreBtn(); updateAuthBtn();
    }

    function setLang(l, btn) {
      lang = l; localStorage.setItem('bcp_lang', l);
      document.querySelectorAll('.lb').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      updateTexts(); renderBeds(); renderPoolPills(); renderSeaPills(); renderSorts(); render(); buildRecs(); applyProfileAutofill();
    }

    function renderBeds() { const t = T[lang]; document.getElementById('beds-pills').innerHTML = BEDS_OPTIONS.map(b => `<span class="bed-pill ${selectedBeds.has(b) ? 'active' : ''}" onclick="toggleBed('${b}')">${t.beds[b]}</span>`).join(''); }
    function toggleBed(b) { if (showFavOnly) exitFavView(); selectedBeds.has(b) ? selectedBeds.delete(b) : selectedBeds.add(b); renderBeds(); render(); updateResetBtn(); updateMoreBtn(); }
    function renderSorts() { const t = T[lang]; document.getElementById('sort-bar').innerHTML = t.sorts.map((s, i) => `<button class="sort-btn ${i === sortIdx ? 'active' : ''}" onclick="setSort(${i})">${s}</button>`).join(''); }
    function setSort(i) { sortIdx = i; renderSorts(); render(); }

    function galleryNav(id, dir, total, e) { e.stopPropagation(); galleryIndex[id] = ((galleryIndex[id] || 0) + dir + total) % total; const wrap = document.getElementById('gallery-' + id); if (!wrap) return; const imgs = ALL_DATA.find(d => d.id === id)?.images || []; const idx = galleryIndex[id]; wrap.querySelector('.gallery-img').src = imgs[idx]; wrap.querySelectorAll('.gallery-dot').forEach((d, i) => d.classList.toggle('active', i === idx)); const pc = wrap.querySelector('.photo-count'); if (pc) pc.textContent = `${idx + 1}/${imgs.length}`; }
    function getCityLabel(d) { return T[lang].cities[d.district ? d.city + '_district' : d.city] || d.city; }
    function roomsLabel(d) { const t = T[lang]; if (ROOMS_TYPES.includes(d.type) && d.rooms === 0) return t.studio; if (d.rooms === 0) return ''; if (d.rooms >= 5) return `5+ ${t.rooms}`; return `${d.rooms} ${t.rooms}`; }
    function buildGallery(d) { const imgs = d.images && d.images.length > 0 ? d.images : []; const idx = galleryIndex[d.id] || 0; if (!imgs.length) return `<div class="no-photo">${d.emoji}</div>`; const dots = imgs.length > 1 ? `<div class="gallery-nav-dots">${imgs.map((_, i) => `<button class="gallery-dot ${i === idx ? 'active' : ''}" onclick="event.stopPropagation();galleryNav(${d.id},${i - idx},${imgs.length},event)"></button>`).join('')}</div>` : ''; const navBtns = imgs.length > 1 ? `<button class="gallery-prev" onclick="galleryNav(${d.id},-1,${imgs.length},event)">‹</button><button class="gallery-next" onclick="galleryNav(${d.id},1,${imgs.length},event)">›</button>` : ''; const count = imgs.length > 1 ? `<span class="photo-count">${idx + 1}/${imgs.length}</span>` : ''; return `<img class="gallery-img" src="${imgs[idx]}" alt="фото">${navBtns}${dots}${count}`; }

    function render() {
      const t = T[lang];
      const cityFilter = document.getElementById('fc').value; const type = document.getElementById('ft').value; const market = document.getElementById('fm').value; const statusFilter = document.getElementById('fs').value;
      const pmin = (parseFloat(document.getElementById('pmin').value) || 0) / 1000; const pmax = (parseFloat(document.getElementById('pmax').value) || Infinity) / 1000;
      const imin = parseInt(document.getElementById('imin').value) || 0; const imax = parseInt(document.getElementById('imax').value) || Infinity;
      const plotmin = parseInt(document.getElementById('plotmin').value) || 0; const plotmax = parseInt(document.getElementById('plotmax').value) || Infinity;
      const ymin = parseInt(document.getElementById('ymin').value) || 0; const ymax = parseInt(document.getElementById('ymax').value) || Infinity;
      let f = ALL_DATA.filter(d => {
        if (showFavOnly && !favs.has(d.id)) return false;
        if (cityFilter) { if (cityFilter.endsWith('_district')) { if (d.city + '_district' !== cityFilter) return false; } else { if (d.city !== cityFilter || d.district) return false; } }
        if (type && d.type !== type) return false; if (market && d.market !== market) return false;
        if (statusFilter === 'available' && d.status !== 'available') return false; if (statusFilter === 'sold' && d.status !== 'sold') return false; if (statusFilter === 'unavailable' && d.status !== 'unavailable') return false;
        if (selectedBeds.size > 0) { if (!ROOMS_TYPES.includes(d.type)) return false; const bedKey = d.rooms === 0 ? 'studio' : d.rooms >= 5 ? '5+' : String(d.rooms); if (!selectedBeds.has(bedKey)) return false; }
        if (d.price < pmin || d.price > pmax) return false;
        if (d.internal_area && (d.internal_area < imin || d.internal_area > imax)) return false;
        if (PLOT_TYPES.includes(d.type) && d.plot_size && (d.plot_size < plotmin || d.plot_size > plotmax)) return false;
        if (ymin > 0 && d.year_built && d.year_built < ymin) return false; if (ymax < Infinity && d.year_built && d.year_built > ymax) return false;
        if (selectedPool.size > 0) { const poolVal = d.pool || 'none'; if (!selectedPool.has(poolVal)) return false; }
        if (filterSea && !d.sea_walking) return false;
        return true;
      });
      f = [...f].sort(SORT_FNS[sortIdx]);
      document.getElementById('rc').textContent = t.res(f.length);
      const con = document.getElementById('lst');
      if (!f.length) { con.innerHTML = `<div class="none">${showFavOnly ? t.favEmpty : t.none}</div>`; return; }
      con.innerHTML = f.map((d) => {
        const isSold = d.status === 'sold', isUnavail = d.status === 'unavailable', isFav = favs.has(d.id);
        let badgeClass = '', badgeText = '';
        if (isSold) { badgeClass = 'badge-sold'; badgeText = t.soldBadge; } else if (isUnavail) { badgeClass = 'badge-unavailable'; badgeText = t.unavailBadge; } else if (d.market === 'new') { badgeClass = 'badge-new-build'; badgeText = t.newBuild; } else { badgeClass = 'badge-resale'; badgeText = t.resale; }
        const rl = roomsLabel(d), note = notes[d.id] || '', isEditingThis = editingNote === d.id;
        const noteHtml = isFav ? `<div class="note-area">${isEditingThis ? `<div class="note-edit-wrap"><textarea class="note-input" id="note-input-${d.id}" rows="3" onclick="event.stopPropagation()">${note}</textarea><button class="note-save-btn" onclick="event.stopPropagation();saveNote(${d.id})">${t.noteSave}</button></div>` : `<div class="note-display ${note ? '' : 'empty'}" onclick="startEditNote(${d.id},event)">${note ? '📝 ' + note : '📝 ' + t.notePlaceholder}</div>`}</div>` : '';
        return `<div class="card ${d.status}" onclick="goToProperty(${d.id})"><div class="card-img-wrap" id="gallery-${d.id}">${buildGallery(d)}${isSold ? `<div class="sold-overlay"><div class="sold-stamp">${t.soldBadge}</div></div>` : ''}<button class="fav-btn" onclick="toggleFav(${d.id},event)">${isFav ? '❤️' : '🤍'}</button><span class="status-badge ${badgeClass}">${badgeText}</span></div><div class="card-body"><div class="card-top"><span class="card-title">${d['title_' + lang]}${d.is_new && !isSold ? `<span class="new-badge">${t.newBadge}</span>` : ''}</span><span class="card-price">€${(d.price * 1000).toLocaleString()}</span></div><div class="card-meta"><span>📍 ${getCityLabel(d)}</span>${rl ? `<span>🛏️ ${rl}</span>` : ''}<span>📐 ${d.area} ${t.area}</span>${d.year_built ? `<span>🏗️ ${d.year_built}</span>` : ''}${d.pool && d.pool !== 'none' ? `<span>${d.pool === 'yes' ? '🏊 ' + t.poolYes : '🏊 ' + t.poolPossible}</span>` : ''} ${d.sea_walking ? `<span>🌊</span>` : ''}</div><span class="tag">${d['tag_' + lang]}</span>${noteHtml}<div class="card-footer"><span class="view-btn">${t.viewMore}</span><button class="quick-wa" onclick="event.stopPropagation();location.href='https://wa.me/35799000000?text=${encodeURIComponent(d['title_' + lang])}'">💬 ${t.wa}</button></div></div></div>`;
      }).join('');
    }

    window.onload = async function () {
      const savedLang = localStorage.getItem('bcp_lang');
      if (savedLang && T[savedLang]) {
        lang = savedLang;
        const activeLb = document.querySelector(`.lb[onclick*="'${savedLang}'"]`);
        if (activeLb) { document.querySelectorAll('.lb').forEach(b => b.classList.remove('active')); activeLb.classList.add('active'); }
      }
      if (isLoggedIn()) { await refreshProfile(); await loadFavsFromSupabase(); } else { loadLocalStorage(); }
      updateTexts(); renderBeds(); renderPoolPills(); renderSeaPills(); renderSorts(); updateAuthBtn();
      try { ALL_DATA = await fetchProperties(); render(); buildRecs(); applyProfileAutofill(); }
      catch (e) { document.getElementById('lst').innerHTML = `<div class="none">${T[lang].error}</div>`; }
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
