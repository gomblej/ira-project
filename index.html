<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .app { width: 100%; max-width: 1200px; margin: 0 auto; padding: 16px; }

  .lb.active { border: 2px solid #1a1a1a; }
  .lb img { display: block; border-radius: 2px; }

  .logo { font-size: 13px; color: #888; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }

  .filters { background: white; border-radius: 16px; padding: 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
  .fg { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .fg label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  select { font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid #e0e0e0; background: #f8f8f8; color: #1a1a1a; width: 100%; }

  .price-range { display: flex; gap: 6px; align-items: center; }
  .price-range input { font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid #e0e0e0; background: #f8f8f8; color: #1a1a1a; width: 100%; }
  .price-range span { color: #aaa; font-size: 13px; flex-shrink: 0; }

  .beds-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .bed-pill { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 1px solid #e0e0e0; background: #f8f8f8; color: #666; cursor: pointer; user-select: none; }
  .bed-pill.active { background: #0f6e56; color: white; border-color: #0f6e56; }

  .sticky-bar { position: sticky; top: 0; z-index: 100; background: #f5f5f0; padding: 8px 0; margin-bottom: 4px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .sort-bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .sort-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; background: white; color: #666; cursor: pointer; }
  .sort-btn.active { background: #0f6e56; color: white; border-color: #0f6e56; }
  .fav-toggle { font-size: 13px; padding: 7px 16px; border-radius: 20px; border: 1px solid #ddd; background: white; color: #666; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: all 0.2s; }
  .fav-toggle.active { background: #fce4ec; color: #ad1457; border-color: #ad1457; font-weight: 500; }

  .count { font-size: 13px; color: #888; margin-bottom: 10px; }

  .loading { text-align: center; padding: 40px; color: #888; font-size: 15px; grid-column: 1/-1; }

  .card { background: white; border-radius: 16px; overflow: hidden; position: relative; }
  .card-img { width: 100%; height: 160px; background: linear-gradient(135deg, #e6f7f2, #b2e0d0); display: flex; align-items: center; justify-content: center; font-size: 56px; position: relative; }
  .card.sold .card-img { filter: grayscale(60%); }
  .card.unavailable .card-img { filter: grayscale(30%); }

  .fav-btn { position: absolute; top: 10px; right: 10px; background: white; border: none; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .status-badge { position: absolute; top: 10px; left: 10px; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 700; z-index: 2; }
  .badge-new-build { background: #e3f2fd; color: #1565c0; }
  .badge-resale { background: #f3e5f5; color: #6a1b9a; }
  .badge-sold { background: #1a1a1a; color: white; }
  .badge-unavailable { background: #fff3cd; color: #856404; }

  .sold-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .sold-stamp { font-size: 28px; font-weight: 900; color: rgba(0,0,0,0.18); border: 4px solid rgba(0,0,0,0.15); padding: 6px 16px; border-radius: 8px; transform: rotate(-15deg); letter-spacing: 2px; text-transform: uppercase; }

  .card-body { padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-price { font-size: 15px; font-weight: 700; color: #0f6e56; white-space: nowrap; }
  .card.sold .card-price { color: #888; text-decoration: line-through; }
  .card-meta { display: flex; gap: 10px; font-size: 13px; color: #888; margin-bottom: 10px; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; background: #e6f7f2; color: #0f6e56; font-weight: 500; margin-bottom: 12px; }
  .new-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fff3e0; color: #e65100; font-weight: 600; margin-left: 6px; }

  .btns { display: flex; flex-direction: column; gap: 7px; }
  .btn { width: 100%; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bwa { background: #25D366; color: white; }
  .bem { background: #f0f0f0; color: #1a1a1a; }
  .bfrm { background: white; color: #888; border: 1px solid #e0e0e0 !important; font-size: 13px; }
  .card.sold .bwa, .card.sold .bem { opacity: 0.5; pointer-events: none; }

  .sbtn { background: #0f6e56; color: white; border: none; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }

  .action-icon { font-size: 28px; }
  .action-text strong { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }

    baSell:'מוכר נכס?', baSellSub:'ספר לנו על הנכס שלך',
    sfRooms:'חדרי שינה', sfBudget:'תקציב (€)', sfMsg:'העדפות',
    sellArea:'שטח (מ״ר)', sellPrice:'מחיר (€)', sellDesc:'תיאור הנכס',
    priceFrom:'מ-€', priceTo:'עד €', rtl:true
  }
};

let lang='ru', sortIdx=4, favs=new Set(), notes={}, openForms=new Set(), editingNote=null, openBottom=null;
let showFavOnly=false, selectedBeds=new Set();
let ALL_DATA = [];

const SORT_FNS=[
  (a,b)=>a.price-b.price,(a,b)=>b.price-a.price,
  (a,b)=>a.rooms-b.rooms,(a,b)=>a.area-b.area,
  (a,b)=>a.days_ago-b.days_ago,
];

function onFilter(){
  if(showFavOnly) exitFavView();
  else render();
}

function exitFavView(){
  showFavOnly=false;
  updateFavBtn();
  render();
}

function updateFavBtn(){
  const t=T[lang];
  const btn=document.getElementById('fav-toggle');
  btn.classList.toggle('active', showFavOnly);
  document.getElementById('fav-label').textContent=showFavOnly?t.favLabelExit:t.favLabel;
}

function setLang(l, btn){
  lang=l;
  const t=T[l];
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('app').setAttribute('dir', t.rtl?'rtl':'ltr');
  document.getElementById('hn').textContent=t.h;
  document.getElementById('hs').textContent=t.s;
  document.getElementById('lc').textContent=t.lc;
  document.getElementById('lt').textContent=t.lt;
  document.getElementById('lm').textContent=t.lm;
  document.getElementById('lst-label').textContent=t.lstL;
  document.getElementById('lb2').textContent=t.lb2;
  document.getElementById('lp').textContent=t.lp;
  document.getElementById('pmin').placeholder=t.priceFrom;
  document.getElementById('pmax').placeholder=t.priceTo;

  const cityKeys=['Limassol','Limassol_district','Paphos','Paphos_district','Larnaca','Larnaca_district','Nicosia','Nicosia_district','Famagusta_district'];
  const fc=document.getElementById('fc');
  fc.options[0].text=t.all;
  cityKeys.forEach((c,i)=>{ if(fc.options[i+1]) fc.options[i+1].text=t.cities[c]; });

  const ft=document.getElementById('ft');
  ft.options[0].text=t.all;
  ['apt','penthouse','house','townhouse','land_res','land_other','commercial','building'].forEach((v,i)=>{ if(ft.options[i+1]) ft.options[i+1].text=t[v]; });

  const fmk=document.getElementById('fm');
  fmk.options[0].text=t.all;
  if(fmk.options[1]) fmk.options[1].text=t.newBuild;
  if(fmk.options[2]) fmk.options[2].text=t.resale;

  const fs=document.getElementById('fs');
  if(fs.options[0]) fs.options[0].text=t.statusAll;
  if(fs.options[1]) fs.options[1].text=t.statusAvailable;
  if(fs.options[2]) fs.options[2].text=t.statusSold;
  if(fs.options[3]) fs.options[3].text=t.statusUnavailable;

  document.getElementById('ba-search').textContent=t.baSearch;
  document.getElementById('ba-search-sub').textContent=t.baSearchSub;
  document.getElementById('ba-sell').textContent=t.baSell;
  document.getElementById('ba-sell-sub').textContent=t.baSellSub;

  openForms.clear(); openBottom=null; editingNote=null;
  document.getElementById('search-form').innerHTML='';
  document.getElementById('sell-form').innerHTML='';
  updateFavBtn();
  renderBeds(); renderSorts(); render();
}

function renderBeds(){
  const t=T[lang];
  document.getElementById('beds-pills').innerHTML=BEDS_OPTIONS.map(b=>`
    <span class="bed-pill ${selectedBeds.has(b)?'active':''}" onclick="toggleBed('${b}')">${t.beds[b]}</span>
  `).join('');
}

function toggleBed(b){
  if(showFavOnly) exitFavView();
  selectedBeds.has(b)?selectedBeds.delete(b):selectedBeds.add(b);
  renderBeds(); render();
}

function renderSorts(){
  const t=T[lang];
  document.getElementById('sort-bar').innerHTML=t.sorts.map((s,i)=>
    `<button class="sort-btn ${i===sortIdx?'active':''}" onclick="setSort(${i})">${s}</button>`
  ).join('');
}

function setSort(i){ sortIdx=i; renderSorts(); render(); }
function toggleFav(id){ if(favs.has(id)){ favs.delete(id); delete notes[id]; } else favs.add(id); render(); }
function toggleForm(i){ openForms.has(i)?openForms.delete(i):openForms.add(i); render(); }
function toggleFavView(){ showFavOnly=!showFavOnly; updateFavBtn(); render(); }

function startEditNote(id){
  editingNote=id; render();
  const el=document.getElementById('note-input-'+id);
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function saveNote(id){
  const el=document.getElementById('note-input-'+id);
  if(el) notes[id]=el.value.trim();
  editingNote=null; render();
}

function toggleBottomForm(which){
  const t=T[lang];
  openBottom=openBottom===which?null:which;
  const sf=document.getElementById('search-form');
  const sl=document.getElementById('sell-form');
  if(openBottom==='search'){
    sf.innerHTML=`<div class="cform">
      <input type="text" placeholder="${t.fn}">
      <input type="text" placeholder="${t.fphone}">
      <select><option value="">${t.sfRooms}</option><option>Студия</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select>
      <input type="text" placeholder="${t.sfBudget}">
      <select><option value="">${t.lm}</option><option value="new">${t.newBuild}</option><option value="resale">${t.resale}</option></select>
      <textarea rows="3" placeholder="${t.sfMsg}"></textarea>
      <button class="sbtn">${t.send}</button></div>`;
    sl.innerHTML='';
  } else if(openBottom==='sell'){
    sl.innerHTML=`<div class="cform">
      <input type="text" placeholder="${t.fn}">
      <input type="text" placeholder="${t.fphone}">
      <select><option value="">${t.lt}</option><option value="apt">${t.apt}</option><option value="penthouse">${t.penthouse}</option><option value="house">${t.house}</option><option value="townhouse">${t.townhouse}</option><option value="land_res">${t.land_res}</option><option value="land_other">${t.land_other}</option><option value="commercial">${t.commercial}</option><option value="building">${t.building}</option></select>
      <select><option value="">${t.lm}</option><option value="new">${t.newBuild}</option><option value="resale">${t.resale}</option></select>
      <input type="text" placeholder="${t.sellArea}">
      <input type="text" placeholder="${t.sellPrice}">
      <textarea rows="3" placeholder="${t.sellDesc}"></textarea>
      <button class="sbtn">${t.send}</button></div>`;
    sf.innerHTML='';
  } else { sf.innerHTML=''; sl.innerHTML=''; }
}

function getCityLabel(d){
  const key=d.district?d.city+'_district':d.city;
  return T[lang].cities[key]||d.city;
}

function roomsLabel(d){
  const t=T[lang];
  if(ROOMS_TYPES.includes(d.type)&&d.rooms===0) return t.studio;
  if(d.rooms===0) return '';
  if(d.rooms>=5) return `5+ ${t.rooms}`;
  return `${d.rooms} ${t.rooms}`;
}

function render(){
  const t=T[lang];
  const cityFilter=document.getElementById('fc').value;
  const type=document.getElementById('ft').value;
  const market=document.getElementById('fm').value;
  const statusFilter=document.getElementById('fs').value;
  const pmin=(parseFloat(document.getElementById('pmin').value)||0)/1000;
  const pmax=(parseFloat(document.getElementById('pmax').value)||Infinity)/1000;

  let f=ALL_DATA.filter(d=>{
    if(showFavOnly&&!favs.has(d.id)) return false;
    if(cityFilter){
      if(cityFilter.endsWith('_district')){ if(d.city+'_district'!==cityFilter) return false; }
      else { if(d.city!==cityFilter||d.district) return false; }
    }
    if(type&&d.type!==type) return false;
    if(market&&d.market!==market) return false;
    if(statusFilter==='available'&&d.status!=='available') return false;
    if(statusFilter==='sold'&&d.status!=='sold') return false;
    if(statusFilter==='unavailable'&&d.status!=='unavailable') return false;
    if(selectedBeds.size>0){
      if(!ROOMS_TYPES.includes(d.type)) return false;
      const bedKey=d.rooms===0?'studio':d.rooms>=5?'5+':String(d.rooms);
      if(!selectedBeds.has(bedKey)) return false;
    }
    if(d.price<pmin) return false;
    if(d.price>pmax) return false;
    return true;
  });

  f=[...f].sort(SORT_FNS[sortIdx]);
  document.getElementById('rc').textContent=t.res(f.length);
  const con=document.getElementById('lst');
  if(!f.length){ con.innerHTML=`<div class="none">${showFavOnly?t.favEmpty:t.none}</div>`; return; }

  con.innerHTML=f.map((d,i)=>{
    const isSold=d.status==='sold';
    const isUnavail=d.status==='unavailable';
    const isFav=favs.has(d.id);
    let badgeClass='', badgeText='';
    if(isSold){ badgeClass='badge-sold'; badgeText=t.soldBadge; }
    else if(isUnavail){ badgeClass='badge-unavailable'; badgeText=t.unavailBadge; }
    else if(d.market==='new'){ badgeClass='badge-new-build'; badgeText=t.newBuild; }
    else { badgeClass='badge-resale'; badgeText=t.resale; }
    const rl=roomsLabel(d);
    const note=notes[d.id]||'';
    const isEditingThis=editingNote===d.id;

    const noteHtml=isFav?`<div class="note-area">
      ${isEditingThis
        ? `<textarea class="note-input" id="note-input-${d.id}" rows="2" placeholder="${t.notePlaceholder}" onblur="saveNote(${d.id})">${note}</textarea>`
        : `<div class="note-display ${note?'':'empty'}" onclick="startEditNote(${d.id})">${note?'📝 '+note:'📝 '+t.notePlaceholder}</div>`
      }
    </div>`:'';

    return `
    <div class="card ${d.status}">
      <div class="card-img">
        ${d.emoji}
        ${isSold?`<div class="sold-overlay"><div class="sold-stamp">${t.soldBadge}</div></div>`:''}
        <button class="fav-btn" onclick="toggleFav(${d.id})">${isFav?'❤️':'🤍'}</button>
        <span class="status-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-title">${d['title_'+lang]}${d.is_new&&!isSold?`<span class="new-badge">${t.newBadge}</span>`:''}</span>
          <span class="card-price">€${(d.price*1000).toLocaleString()}</span>
        </div>
        <div class="card-meta">
          <span>📍 ${getCityLabel(d)}</span>
          ${rl?`<span>🛏️ ${rl}</span>`:''}
          <span>📐 ${d.area} ${t.area}</span>
        </div>
        <span class="tag">${d['tag_'+lang]}</span>
        ${noteHtml}
        <div class="btns">
          <button class="btn bwa" onclick="location.href='https://wa.me/35799000000?text=${encodeURIComponent(d['title_'+lang])}'">💬 ${t.wa}</button>
          <button class="btn bem" onclick="location.href='mailto:info@bestcyprusproperties.com?subject=${encodeURIComponent(d['title_'+lang])}'">✉️ ${t.em}</button>
          <button class="btn bfrm" onclick="toggleForm(${i})">📝 ${t.frm}</button>
          ${openForms.has(i)?`<div class="cform">
            <input type="text" placeholder="${t.fn}">
            <input type="text" placeholder="${t.fphone}">
            <textarea rows="2" placeholder="${t.fmsg}"></textarea>
            <button class="sbtn">${t.send}</button>
          </div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.onload = async function(){
  setLang('ru', document.querySelector('.lb'));
  try {
    ALL_DATA = await fetchProperties();
    render();
  } catch(e) {
    document.getElementById('lst').innerHTML=`<div class="none">${T[lang].error}</div>`;
  }
};
</script>
</body>
</html>
