<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль — Best Cyprus Properties</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }
  .page { max-width: 600px; margin: 0 auto; padding: 20px; }

  .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #666; background: white; border: none; border-radius: 20px; padding: 8px 16px; cursor: pointer; margin-bottom: 16px; text-decoration: none; }

  .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

  .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #0f6e56, #1a9070); display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; font-weight: 700; margin: 0 auto 16px; }

  .user-name { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .user-email { text-align: center; font-size: 14px; color: #888; margin-bottom: 20px; }

  .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .form-group label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input { font-size: 15px; padding: 11px 14px; border-radius: 12px; border: 1px solid #e0e0e0; background: #f8f8f8; color: #1a1a1a; font-family: inherit; width: 100%; }
  .form-group input:focus { outline: none; border-color: #0f6e56; background: white; }
  .form-group input:disabled { color: #aaa; }

  .save-btn { width: 100%; padding: 13px; border-radius: 12px; border: none; background: #0f6e56; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .danger-btn { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid #e0e0e0; background: white; color: #c0392b; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px; }

  .msg { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 14px; display: none; }
  .msg.success { background: #e6f7f2; color: #0f6e56; }
  .msg.error { background: #fff0f0; color: #c0392b; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat { flex: 1; background: #f8f8f8; border-radius: 12px; padding: 14px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 700; color: #0f6e56; }
  .stat-label { font-size: 12px; color: #888; margin-top: 2px; }

  .fav-list { display: flex; flex-direction: column; gap: 8px; }
  .fav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #f8f8f8; border-radius: 12px; cursor: pointer; text-decoration: none; color: #1a1a1a; }
  .fav-item:hover { background: #e6f7f2; }
  .fav-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .fav-thumb img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .fav-info { flex: 1; min-width: 0; }
  .fav-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-price { font-size: 13px; color: #0f6e56; font-weight: 600; }
  .loading { text-align: center; padding: 30px; color: #888; }
</style>
</head>
<body>
<div class="page">
  <a class="back-btn" href="index.html">← На главную</a>

  <div class="msg" id="msg"></div>

  <div class="card" style="text-align:center">
    <div class="avatar" id="avatar">?</div>
    <div class="user-name" id="user-name">Загружаем...</div>
    <div class="user-email" id="user-email"></div>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="fav-count">0</div><div class="stat-label">В избранном</div></div>
      <div class="stat"><div class="stat-num" id="notes-count">0</div><div class="stat-label">Заметок</div></div>
    </div>
  </div>

  <div class="card">
    <h2>👤 Личные данные</h2>
    <div class="form-group"><label>Имя</label><input type="text" id="p-name" placeholder="Ваше имя"></div>
    <div class="form-group"><label>Email</label><input type="email" id="p-email" disabled></div>
    <div class="form-group"><label>Телефон</label><input type="tel" id="p-phone" placeholder="+357..."></div>
    <button class="save-btn" id="save-profile-btn" onclick="saveProfile()">Сохранить</button>
  </div>

  <div class="card">
    <h2>🔑 Сменить пароль</h2>
    <div class="form-group"><label>Новый пароль</label><input type="password" id="new-password" placeholder="Минимум 6 символов"></div>
    <div class="form-group"><label>Повторите пароль</label><input type="password" id="new-password2" placeholder="Повторите пароль"></div>
    <button class="save-btn" onclick="changePassword()">Сменить пароль</button>
  </div>

  <div class="card">
    <h2>❤️ Избранное</h2>
    <div id="fav-list"><div class="loading">Загружаем...</div></div>
  </div>

  <div class="card">
    <button class="danger-btn" onclick="logout()">Выйти из аккаунта</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lfgqhprihykoxqfnubhc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-E46ER3EDjD4TTMMiTRaCQ_9xAe36q_';

function getToken(){ return localStorage.getItem('bcp_token')||''; }
function authHeaders(){ return { 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${getToken()}`, 'Content-Type':'application/json' }; }

function showMsg(text, type){
  const el=document.getElementById('msg');
  el.textContent=text; el.className=`msg ${type}`; el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; }, 4000);
}

function logout(){
  localStorage.removeItem('bcp_token');
  localStorage.removeItem('bcp_refresh');
  localStorage.removeItem('bcp_user');
  localStorage.removeItem('bcp_profile');
  window.location.href='index.html';
}

async function loadProfile(){
  const token = getToken();
  if(!token){ window.location.href='auth.html'; return; }

  // Получаем пользователя
  const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${token}` }
  });
  if(!userRes.ok){ window.location.href='auth.html'; return; }
  const user = await userRes.json();

  document.getElementById('p-email').value = user.email||'';
  document.getElementById('user-email').textContent = user.email||'';

  // Получаем профиль
  const profRes = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${user.id}&select=*`, {
    headers: authHeaders()
  });
  const profiles = await profRes.json();
  const profile = profiles[0]||{};

  const name = profile.name || user.user_metadata?.name || '';
  document.getElementById('p-name').value = name;
  document.getElementById('p-phone').value = profile.phone||'';
  document.getElementById('user-name').textContent = name||'Без имени';
  document.getElementById('avatar').textContent = name ? name[0].toUpperCase() : '?';

  // Избранное
  await loadFavourites(user.id);
}

async function loadFavourites(userId){
  const favRes = await fetch(`${SUPABASE_URL}/rest/v1/user_favourites?user_id=eq.${userId}&select=property_id`, {
    headers: authHeaders()
  });
  const favs = await favRes.json();
  document.getElementById('fav-count').textContent = favs.length;

  // Заметки
  const notesRes = await fetch(`${SUPABASE_URL}/rest/v1/user_notes?user_id=eq.${userId}&select=property_id`, {
    headers: authHeaders()
  });
  const notes = await notesRes.json();
  document.getElementById('notes-count').textContent = notes.length;

  const list = document.getElementById('fav-list');
  if(!favs.length){ list.innerHTML='<div class="loading" style="color:#aaa">Нет избранных объектов</div>'; return; }

  // Загружаем данные объектов
  const ids = favs.map(f=>f.property_id).join(',');
  const propsRes = await fetch(`${SUPABASE_URL}/rest/v1/Properties?id=in.(${ids})&select=id,title_ru,price,images,emoji`, {
    headers: authHeaders()
  });
  const props = await propsRes.json();

  list.innerHTML = props.map(p=>{
    const thumb = p.images&&p.images.length>0
      ? `<div class="fav-thumb"><img src="${p.images[0]}" alt="фото"></div>`
      : `<div class="fav-thumb">${p.emoji}</div>`;
    return `<a class="fav-item" href="property.html?id=${p.id}">
      ${thumb}
      <div class="fav-info">
        <div class="fav-title">${p.title_ru}</div>
        <div class="fav-price">€${(p.price*1000).toLocaleString()}</div>
      </div>
      <span style="color:#aaa">→</span>
    </a>`;
  }).join('');
}

async function saveProfile(){
  const name = document.getElementById('p-name').value.trim();
  const phone = document.getElementById('p-phone').value.trim();
  const btn = document.getElementById('save-profile-btn');
  btn.disabled=true; btn.textContent='Сохраняем...';

  const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${getToken()}` }
  });
  const user = await userRes.json();

  const res = await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${user.id}`, {
    method:'PATCH',
    headers:{ ...authHeaders(), 'Prefer':'return=minimal' },
    body: JSON.stringify({ name, phone })
  });

  if(res.ok){
    showMsg('Данные сохранены', 'success');
    document.getElementById('user-name').textContent = name||'Без имени';
    document.getElementById('avatar').textContent = name ? name[0].toUpperCase() : '?';
    localStorage.setItem('bcp_profile', JSON.stringify({ name, phone }));
  } else { showMsg('Ошибка сохранения', 'error'); }

  btn.disabled=false; btn.textContent='Сохранить';
}

async function changePassword(){
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('new-password2').value;
  if(p1.length<6){ showMsg('Минимум 6 символов', 'error'); return; }
  if(p1!==p2){ showMsg('Пароли не совпадают', 'error'); return; }

  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method:'PUT',
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${getToken()}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ password: p1 })
  });

  if(res.ok){ showMsg('Пароль изменён', 'success'); document.getElementById('new-password').value=''; document.getElementById('new-password2').value=''; }
  else { showMsg('Ошибка смены пароля', 'error'); }
}

window.onload = loadProfile;
</script>
</body>
</html>
